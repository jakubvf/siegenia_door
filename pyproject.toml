[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = [
    "ASYNC", # flake8-async
    "B",     # flake8-bugbear
    "E",     # pycodestyle errors
    "F",     # pyflakes
    "I",     # isort
    "RET",   # flake8-return
    "SIM",   # flake8-simplify
    "UP",    # pyupgrade
    "W",     # pycodestyle warnings
]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components.siegenia_door"]
combine-as-imports = true

[tool.ruff.lint.per-file-ignores]
# The diagnostic script is a standalone tool users run by hand; its output is
# full of long human-readable strings that are clearer unwrapped.
"tools/diagnostic_script.py" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
