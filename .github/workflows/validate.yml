name: Validate

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Both validators track upstream rules, so this catches breakage that
    # lands without any change to this repository.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # This action takes no inputs; it runs the hassfest container over the
      # checkout and validates every manifest.json it finds.
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # No `ignore:` here on purpose. The brand images ship in the integration
      # folder, and any ignore disqualifies the repo from the default store.
      - uses: hacs/action@main
        with:
          category: integration

  ruff:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/ruff-action@v3
        with:
          args: check --output-format=github
      - uses: astral-sh/ruff-action@v3
        with:
          args: format --check
